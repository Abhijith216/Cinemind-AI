name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+asyncpg://unused:unused@127.0.0.1:9/unused
      RATE_LIMIT_BACKEND: memory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio ruff mypy
      - working-directory: backend
        run: |
          ruff check app tests
          mypy app
          pytest -q -p no:cacheprovider
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: isolated-ci-only-signing-secret-do-not-use-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: docker compose -p cinemind-ci up --build -d
      - run: python scripts/container_smoke.py
      - if: failure()
        run: docker compose -p cinemind-ci logs --tail=80
      - if: always()
        run: docker compose -p cinemind-ci down -v
